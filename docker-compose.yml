services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: worldbank_opportunities
      POSTGRES_USER: worldbank
      POSTGRES_PASSWORD: worldbank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldbank -d worldbank_opportunities"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
